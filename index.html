<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Product preview card component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
    .little-card {
      background-color: hsl(0, 0%, 100%); 
      height: 166px; 
      width: 155px; 
    }
    h1, .line2 div, h3 {
     color: gray; 
    }
    h2 {
      color: rgba(41, 128, 80, 0.788);
    }
    h1, h2 {
      margin-left: 88px;
    }
    h1 { 
      font-weight: 500;  
      margin-left: 550px;
    } 
    h2 {
      font-weight: 700;
      margin-left: 550px;
    }
    h3 {
      font-weight: 500;
      margin-left: 665px; 
      margin-top: -33px;
    }
    img {
      margin-left: 550px;
    }
    button { 
      background-color: rgba(41, 128, 80, 0.788); 
      color: hsl(0, 0%, 100%); 
      margin-left: 550px; 
      width: 550px;
      height: 55px;  
      font-size: 14px; 
      text-align: center; 
    } 
    h2 {
      margin-left: 565px; 
    }
    .line1 div, .line2 div {
      display: inline-block; 
    }
    .line1 div {
      font-weight: 700; 
      font-size: 15px; 
      text-align: center; 
      margin-left: 550px;  
    }
    .line2 div {
      font-size: 14px; 
      text-align: center; 
      margin-left: 550px; 
      font-weight: 500;  
    }
    .line1, .line2 {
      text-align: center;
    }
    .perfume-name1 {
      position: relative; 
      left: 550px; 
    }
    .perfume-name2 {
      position: relative; 
      left: 538px;
    }
    .paragraph1, .paragraph2, .paragraph3, .paragraph4 {
      position: relative; 
    }
    .paragraph1 {
      left: 550px;
    }
    .paragraph2 {
      left: 550px;
    }
    .paragraph3 {
      left: 550px; 
    }
    .paragraph4 { 
      left: 550px; 
    }
    @media only screen and (max-width: 900px) {
      .perfume {
        float: left; 
        position: relative; 
        right: 690px; 
      }
      h1, h2, h3, .perfume-name1, .perfume-name2, .paragraph1, .paragraph2, .paragraph3, .paragraph4, .cart, .cart-button  {
        float: right; 
        position: relative; 
      }
      h1 {
        left: 600px; 
        bottom: 500px;
      }
      .perfume-name1, .perfume-name2, .paragraph1, .paragraph2, .paragraph3, .paragraph4 {
        left: 600px;
        bottom: 500px; 
      }
      h2, h3, .cart, .cart-button {
        left: 600px;
      }
    }
  </style>
</head>
<body>
<div class="little-card">
  <img src="images/image-product-mobile.jpg" class="perfume">
  <h1>PERFUME</h1>
  <div class="line1">
  <p class="perfume-name1">Gabrielle Essence</p>
  <br/>
  <p class="perfume-name2">Eau De Parfum</p>
  </div>
  <div class="line2">
  <p class="paragraph1">A floral, solar and voluptuous</p>
  <br/>
  <p class="paragraph2">interpretation composed by Olivier</p>
  <br/>
  <p class="paragraph3">Polge, Perfumer-Creator for the House of</p>
  <br/>
  <p class="paragraph4">CHANEL.</p>
  </div>
  <h2>$149.99</h2>
  <h3>$169.99</h3>
  <img src="images/icon-cart.svg" class="cart">
  <button class="cart-button">Add to Cart</button>
  </div>
  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="#">Zahira Shahir</a>.
  </div>
</body>
</html>
